# Push a tag like v1.0.0 and this builds LatticePartyRaidFrames-v1.0.0-forever.zip, a GitHub release (WowUp installs
# from it via release.json) and uploads the same zip to CurseForge.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Release notes from CHANGELOG.md (GitHub release page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/release-notes.sh "$GITHUB_REF_NAME" > .release/notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file .release/notes.md
      - name: Upload to CurseForge (project 1804904, WoW Forever)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: bash .github/curseforge-upload.sh 1804904 .release/LatticePartyRaidFrames-${GITHUB_REF_NAME}-forever.zip LatticePartyRaidFrames.toc
